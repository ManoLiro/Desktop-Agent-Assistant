appId: com.perssua.app
productName: Perssua
directories:
  output: dist
  buildResources: resources
files:
  - out/**/*
  - package.json
win:
  target:
    - nsis
    - portable
  artifactName: ${productName}-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
